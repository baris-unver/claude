# Offline smoke-test config: synthetic city, tiny backbone, synthetic aerial tiles. Runs on CPU in ~1-2 min.
data:
  city: synthetic
  bbox: [32.80, 39.90, 32.83, 39.92]   # ~2.5 x 2.2 km patch of Ankara coordinates
  root: data
  min_train_spacing_m: 3.0
aerial:
  enabled: true
  url_template: synthetic
  zoom: 18
  patch_px: 64
cells:
  hierarchy_levels: [13, 15, 17]
  database_level: 18
  min_images_per_class: 3
split:
  unseen_block_frac: 0.15
  block_level: 14
model:
  backbone: tiny
  image_size: 64
  embed_dim: 64
  temperature: 0.07
train:
  epochs: 6
  batch_size: 64
  lr: 2.0e-3
  backbone_lr_mult: 1.0
  num_workers: 0
  augment: light
  out_dir: runs/synthetic
retrieval:
  top_k: 16
  refine_radius_m: 120
